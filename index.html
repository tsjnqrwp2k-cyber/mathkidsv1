    if (best != null) sub2.classList.add('rev-tile-best');
    b.appendChild(label);
    b.appendChild(sub2);
    b.addEventListener('click', () => {
      selectedTemplate = n;
      App._revSelected = n;
      grid.querySelectorAll('.rev-tile').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      startBtn.disabled = false;
      startBtn.textContent = `🚀 Start × ${n} Table`;
    });
    grid.appendChild(b);
  }
  screen.appendChild(grid);

  // Start button
  const startBtn = el('button', { class:'btn btn-primary btn-lg btn-full rev-start' },
    selectedTemplate ? `🚀 Start × ${selectedTemplate} Table` : '🚀 Pick a Table First');
  startBtn.disabled = !selectedTemplate;
  startBtn.addEventListener('click', () => {
    if (!selectedTemplate) return;
    App._revSelected = selectedTemplate;
    App.navigate('revisionQuiz');
  });
  screen.appendChild(startBtn);

  return screen;
}

/* ════════════════════════════════════════════
   REVISION QUIZ — 12 sequential questions, fixed order
════════════════════════════════════════════ */
function renderRevisionQuiz() {
  const { kid } = App;
  const template = App._revSelected;
  const N = 12;
  const TIMER_S = 10; // 10s per question
  const FEEDBACK_MS = 1400;

  // Fixed-order question list: template × 1, template × 2, … template × 12
  const questions = [];
  for (let m = 1; m <= 12; m++) {
    questions.push({ display: `${template} × ${m}`, answer: template * m });
  }

  let idx = 0;
  let score = 0;
  let input = '';
  let phase = 'question';
  let timeLeft = TIMER_S * 10; // tenths of a second
  const slots = []; // { display, answer, userAnswer, correct, points, timeTakenS }

  const screen = el('div', { id:'s-quiz', class:'screen quiz-screen' });

  /* --- Header --- */
  const hdr = div('quiz-hdr');
  const progTxt = el('span', { class:'quiz-prog-txt' }, `Question 1 of ${N}`);
  const scoreTxt = el('span', { class:'quiz-score-txt' }, '⭐ 0 pts');
  hdr.appendChild(progTxt); hdr.appendChild(scoreTxt);
  screen.appendChild(hdr);

  const progBarWrap = div('prog-bar-wrap');
  const progBarBg = div('prog-bar-bg');
  const progBarFill = div('prog-bar-fill'); progBarFill.style.width = '0%';
  progBarBg.appendChild(progBarFill); progBarWrap.appendChild(progBarBg); screen.appendChild(progBarWrap);

  const timerWrap = div('timer-wrap');
  const timerBg = div('timer-bg');
  const timerFill = div('timer-fill'); timerFill.style.width = '100%'; timerFill.style.backgroundColor = 'var(--green)';
  timerBg.appendChild(timerFill); timerWrap.appendChild(timerBg);
  const timerTxt = el('div', { class:'timer-txt' }, `${TIMER_S}s`);
  timerWrap.appendChild(timerTxt); screen.appendChild(timerWrap);

  /* --- Question card --- */
  const qa = div('question-area');
  const mascot = el('span', { class:'mascot' }, '📖');
  const qCard = div('card question-card');
  const qTxt = div('question-txt');
  qTxt.textContent = questions[0].display + ' = ?';
  const ansDisp = div('answer-display');
  const cursor = div('cursor');
  ansDisp.appendChild(cursor);
  qCard.appendChild(qTxt); qCard.appendChild(ansDisp);
  qa.appendChild(mascot); qa.appendChild(qCard);
  screen.appendChild(qa);

  /* --- Number pad --- */
  const numPad = div('num-pad');
  const padGrid = div('pad-grid');
  const KEYS_LAYOUT = ['1','2','3','4','5','6','7','8','9','BACK','0','OK'];
  const padBtns = {};
  KEYS_LAYOUT.forEach(k => {
    let b;
    if (k === 'BACK') {
      b = el('button', { class:'pad-btn pad-back', 'aria-label':'Backspace' }, '⌫');
      b.addEventListener('click', () => pressBack());
    } else if (k === 'OK') {
      b = el('button', { class:'pad-btn pad-submit', 'aria-label':'Submit' }, '✓');
      b.setAttribute('disabled', 'true');
      b.addEventListener('click', () => submitAnswer());
    } else {
      b = el('button', { class:'pad-btn pad-digit', 'aria-label':k }, k);
      b.addEventListener('click', () => pressDigit(k));
    }
    padBtns[k] = b;
    padGrid.appendChild(b);
  });
  numPad.appendChild(padGrid);
  screen.appendChild(numPad);

  /* --- Update UI --- */
  function updateUI() {
    const q = questions[idx];
    qTxt.textContent = q.display + ' = ?';
    progTxt.textContent = `Question ${idx + 1} of ${N}`;
    scoreTxt.textContent = `⭐ ${score} pts`;
    progBarFill.style.width = `${(idx / N) * 100}%`;

    const ratio = timeLeft / (TIMER_S * 10);
    timerFill.style.width = `${ratio * 100}%`;
    timerFill.style.backgroundColor = ratio > .5 ? 'var(--green)' : ratio > .25 ? 'var(--yellow)' : 'var(--red)';
    timerTxt.textContent = `${Math.ceil(timeLeft / 10)}s`;
    timerTxt.style.color = ratio > .5 ? 'var(--green)' : ratio > .25 ? 'var(--yellow)' : 'var(--red)';

    mascot.textContent = phase === 'feedback' ? '' : ratio < .3 ? '😰' : '📖';

    while (ansDisp.firstChild) ansDisp.removeChild(ansDisp.firstChild);
    if (input) {
      ansDisp.classList.add('has-val');
      ansDisp.textContent = input;
    } else {
      ansDisp.classList.remove('has-val');
      ansDisp.appendChild(cursor);
    }

    padBtns['OK'].disabled = (input === '' || phase === 'feedback');
    ['1','2','3','4','5','6','7','8','9','0','BACK'].forEach(k => {
      padBtns[k].disabled = (phase === 'feedback');
    });
  }

  /* --- Input --- */
  function pressDigit(d) {
    if (phase !== 'question' || input.length >= 4) return;
    input += d;
    updateUI();
  }
  function pressBack() {
    if (phase !== 'question') return;
    input = input.slice(0, -1);
    updateUI();
  }

  /* --- Submit / feedback --- */
  function submitAnswer() {
    if (phase !== 'question') return;
    clearInterval(App._quizTimer);
    phase = 'feedback';

    const q = questions[idx];
    const userAns = input === '' ? null : parseInt(input, 10);
    const correct = userAns === q.answer;
    const pts = calcPoints(correct, timeLeft / 10, TIMER_S); // 0 wrong; 1–10 correct (speed-scaled)
    const timeTakenS = +(TIMER_S - (timeLeft / 10)).toFixed(1);

    score += pts;
    slots.push({ display: q.display, answer: q.answer, userAnswer: userAns, correct, points: pts, timeTakenS });
    scoreTxt.textContent = `⭐ ${score} pts`;

    mascot.textContent = correct ? '🎉' : '😢';
    mascot.style.animation = correct ? 'bounce .5s ease' : 'shake .45s ease';
    setTimeout(() => { mascot.style.animation = ''; }, 500);

    showFeedback(correct, pts, q.answer);

    App._feedbackTimer = setTimeout(() => {
      removeFeedback();
      mascot.style.animation = '';
      if (idx + 1 >= N) {
        // Session complete → save once, then navigate to results
        const sess = {
          id: Date.now().toString(),
          template, score,
          correctCount: slots.filter(s => s.correct).length,
          slots: [...slots],
          date: new Date().toISOString()
        };
        Store.saveRevisionSession(kid.id, sess);
        App._revisionResult = sess;
        App.navigate('revisionResults');
      } else {
        idx++;
        input = '';
        phase = 'question';
        timeLeft = TIMER_S * 10;
        updateUI();
        startTimer();
      }
    }, FEEDBACK_MS);
  }

  /* --- Feedback overlay (reuse main quiz styling) --- */
  let feedbackOverlay = null;
  function showFeedback(correct, pts, correctAnswer) {
    feedbackOverlay = div('feedback-overlay ' + (correct ? 'correct' : 'wrong'));
    feedbackOverlay.appendChild(el('div', { class:'fb-icon' }, correct ? '✅' : '❌'));
    feedbackOverlay.appendChild(el('div', { class:'fb-title' }, correct ? 'Correct!' : 'Not Quite!'));
    if (correct) {
      feedbackOverlay.appendChild(el('div', { class:'fb-pts' }, `+${pts} point${pts !== 1 ? 's' : ''}!`));
    } else {
      feedbackOverlay.appendChild(el('div', { class:'fb-ans' }, `Answer: ${correctAnswer}`));
    }
    screen.appendChild(feedbackOverlay);
  }
  function removeFeedback() {
    if (feedbackOverlay) { feedbackOverlay.remove(); feedbackOverlay = null; }
  }

  /* --- Timer --- */
  function startTimer() {
    App._quizTimer = setInterval(() => {
      if (phase !== 'question') return;
      timeLeft--;
      updateUI();
      if (timeLeft <= 0) {
        clearInterval(App._quizTimer);
        submitAnswer(); // timeout counts as wrong
      }
    }, 100);
  }

  /* --- Keyboard input --- */
  function handleKey(e) {
    if (phase !== 'question') return;
    if (e.key >= '0' && e.key <= '9') {
      pressDigit(e.key);
      e.preventDefault();
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      pressBack();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      if (input !== '') submitAnswer();
      e.preventDefault();
    }
  }
  document.addEventListener('keydown', handleKey);
  App._quizKeyHandler = handleKey;

  updateUI();
  startTimer();
  return screen;
}

/* ════════════════════════════════════════════
   REVISION RESULTS — score ring, stars, review list
════════════════════════════════════════════ */
function renderRevisionResults() {
  const { kid } = App;
  const r = App._revisionResult;
  const N = 12;
  const MAX = N * 10; // 120
  const correctPct = r.correctCount / N;

  const tier =
    correctPct === 1   ? { label:'PERFECT!',    stars:3, mascot:'🏆', color:'#ffe066', enc:'🌟 PERFECT! You\'re a genius!' } :
    correctPct >= 0.9  ? { label:'Amazing!',    stars:3, mascot:'🎊', color:'#69db7c', enc:'🚀 AMAZING! You\'re a Math Superstar!' } :
    correctPct >= 0.6  ? { label:'Great Job!',  stars:2, mascot:'🚀', color:'#4dabf7', enc:'🎉 GREAT JOB! Keep blasting off!' } :
                         { label:'Keep Going!', stars:1, mascot:'📖', color:'#ff922b', enc:'🌈 Keep practising! You\'re getting stronger!' };

  const showConfetti = correctPct >= 0.9;

  const screen = el('div', { id:'s-results', class:'screen results-screen' });

  // Confetti
  if (showConfetti) {
    const CONF_COLORS = ['#ffe066','#ff6b6b','#69db7c','#4dabf7','#f783ac','#ff922b'];
    for (let i = 0; i < 28; i++) {
      screen.appendChild(el('div', { class:'conf-piece', style:{
        left:`${Math.random()*100}%`,
        background: CONF_COLORS[i % CONF_COLORS.length],
        '--d': `${(Math.random()*1.2+2).toFixed(1)}s`,
        '--dl': `${(Math.random()*.6).toFixed(1)}s`,
        transform: `rotate(${Math.floor(Math.random()*360)}deg)`
      }}));
    }
  }

  screen.appendChild(el('span', { class:'res-mascot' }, tier.mascot));
  screen.appendChild(el('h2', { class:'res-title grad' }, tier.label));

  const subEl = el('p', { class:'res-sub' });
  subEl.textContent = `${kid.name}'s × ${r.template} Times Table`;
  screen.appendChild(subEl);

  // Score ring
  const RING_R = 65, RING_C = 2 * Math.PI * RING_R;
  const targetOffset = RING_C * (1 - r.score / MAX);

  const ringWrap = div('ring-wrap');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 160 160');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const defs = document.createElementNS(svgNS, 'defs');
  const grad = document.createElementNS(svgNS, 'linearGradient');
  grad.setAttribute('id', 'rg2'); grad.setAttribute('x1', '0%'); grad.setAttribute('y1', '0%'); grad.setAttribute('x2', '100%'); grad.setAttribute('y2', '0%');
  const s1 = document.createElementNS(svgNS, 'stop'); s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#6c63ff');
  const s2 = document.createElementNS(svgNS, 'stop'); s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#4dabf7');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad); svg.appendChild(defs);

  const bgCircle = document.createElementNS(svgNS, 'circle');
  bgCircle.setAttribute('class', 'ring-bg'); bgCircle.setAttribute('cx', '80'); bgCircle.setAttribute('cy', '80'); bgCircle.setAttribute('r', RING_R);
  svg.appendChild(bgCircle);

  const fillCircle = document.createElementNS(svgNS, 'circle');
  fillCircle.setAttribute('class', 'ring-fill'); fillCircle.setAttribute('cx', '80'); fillCircle.setAttribute('cy', '80'); fillCircle.setAttribute('r', RING_R);
  fillCircle.setAttribute('stroke', 'url(#rg2)');
  fillCircle.setAttribute('stroke-dasharray', RING_C);
  fillCircle.setAttribute('stroke-dashoffset', RING_C);
  svg.appendChild(fillCircle);
  ringWrap.appendChild(svg);

  const ringText = div('ring-text');
  ringText.appendChild(Object.assign(div('ring-num'), { textContent: r.score }));
  ringText.appendChild(Object.assign(div('ring-max'), { textContent: `/${MAX}` }));
  ringWrap.appendChild(ringText);
  screen.appendChild(ringWrap);
  setTimeout(() => { fillCircle.style.strokeDashoffset = targetOffset; }, 300);

  // Stars
  const starsRow = div('stars-row');
  [1,2,3].forEach(n => {
    starsRow.appendChild(el('span', { class:'star-item', style:{ opacity: n <= tier.stars ? '1' : '0.2' } }, n <= tier.stars ? '⭐' : '☆'));
  });
  screen.appendChild(starsRow);

  // Encouragement
  const enc = { text: tier.enc, color: tier.color };
  const encBanner = div('enc-banner');
  encBanner.textContent = enc.text;
  encBanner.style.background = enc.color + '25';
  encBanner.style.border = `2px solid ${enc.color}55`;
  encBanner.style.color = 'var(--white)';
  screen.appendChild(encBanner);

  // Correct count
  screen.appendChild(el('p', { class:'correct-count' }, `✓ ${r.correctCount}/${N} correct`));

  // Action buttons
  const actWrap = div('res-actions');
  actWrap.appendChild(btn('btn-primary btn-lg btn-full', '🚀 Try Again', () => App.navigate('revisionQuiz')));
  actWrap.appendChild(btn('btn-ghost btn-full', '📖 Pick Another Table', () => App.navigate('revision')));
  actWrap.appendChild(btn('btn-ghost btn-full', '🏠 Home', () => App.navigate('home')));
  screen.appendChild(actWrap);

  // Review list — always expanded (this IS the point of revision)
  const bdSection = div('breakdown-section');
  bdSection.style.opacity = '1'; // override the staged-in animation default of 0
  const bdTitle = el('div', { class:'breakdown-toggle-btn', style:{cursor:'default'} }, '📋 Question Review');
  bdSection.appendChild(bdTitle);

  const bdList = div('breakdown-list');
  r.slots.forEach((s, i) => {
    const item = el('div', { class:`bd-item ${s.correct ? 'bd-correct' : 'bd-wrong'}` });
    item.appendChild(el('span', {}, s.correct ? '✓' : '✗'));
    const qEl = el('span', { class:'bd-q' });
    qEl.textContent = `${s.display} = ${s.answer}`;
    item.appendChild(qEl);
    const yourAns = el('span', { class:'rev-user-ans' });
    yourAns.textContent = s.userAnswer == null ? '—' : `you: ${s.userAnswer}`;
    item.appendChild(yourAns);
    const ptEl = el('span', { class:'bd-pts' });
    ptEl.textContent = s.correct ? `+${s.points} · ${s.timeTakenS}s` : `0 · ${s.timeTakenS}s`;
    item.appendChild(ptEl);
    bdList.appendChild(item);
  });
  bdSection.appendChild(bdList);
  screen.appendChild(bdSection);

  return screen;
}

   START
════════════════════════════════════════════ */
applyTheme(DEFAULT_THEME);
App.render();
scheduleAutoUpdateCheck();
</script>
