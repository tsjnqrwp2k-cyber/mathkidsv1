<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Math Stars"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Math Stars 🚀</title>
<style>
/* ─── Reset & Variables ─── */
:root{
  --bg:#0a0a1a;--navy:#0f1035;--purple:#6c63ff;--blue:#4dabf7;
  --green:#69db7c;--yellow:#ffe066;--orange:#ff922b;--red:#ff6b6b;
  --pink:#f783ac;--white:#fff;--dim:rgba(255,255,255,.65);
  --card:rgba(255,255,255,.07);--border:rgba(255,255,255,.14);
  --track:rgba(255,255,255,.12);--track-strong:rgba(255,255,255,.22);
  --gold-text:#ffe066;
  --r:20px;--rl:28px;--rxl:40px;
  --bg-image:none;--show-stars:1;
}
/* ─── Themes ─── */
body[data-theme="pastel"]{--bg:#fff5f7;--navy:#fde2e7;--purple:#b39ddb;--blue:#9fd3e8;--green:#a8e6cf;--yellow:#ffe1a8;--orange:#ffb59e;--red:#ff8a9c;--pink:#f7a4c2;--white:#44364d;--dim:rgba(68,54,77,.6);--card:rgba(255,255,255,.7);--border:rgba(68,54,77,.12);--track:rgba(68,54,77,.08);--track-strong:rgba(68,54,77,.18);--gold-text:#b45309;--show-stars:0;}
body[data-theme="bw"]{--bg:#ffffff;--navy:#f0f0f0;--purple:#1a1a1a;--blue:#4a4a4a;--green:#2a2a2a;--yellow:#666;--orange:#444;--red:#000;--pink:#888;--white:#000;--dim:rgba(0,0,0,.55);--card:rgba(0,0,0,.04);--border:rgba(0,0,0,.18);--track:rgba(0,0,0,.08);--track-strong:rgba(0,0,0,.22);--gold-text:#000;--show-stars:0;}
body[data-theme="galaxy"]{}
body[data-theme="train"]{--bg:#1e2530;--navy:#2a3340;--purple:#d63031;--blue:#fdcb6e;--green:#55efc4;--yellow:#fab005;--orange:#e17055;--red:#d63031;--pink:#fab1a0;--white:#fff;--dim:rgba(255,255,255,.6);--card:rgba(255,255,255,.08);--border:rgba(255,255,255,.16);--track:rgba(255,255,255,.12);--track-strong:rgba(255,255,255,.22);--gold-text:#fab005;--show-stars:0;}
body[data-theme="girly"]{--bg:#fff0f6;--navy:#ffd6ea;--purple:#c084fc;--blue:#a78bfa;--green:#86efac;--yellow:#fcd34d;--orange:#fb923c;--red:#ec4899;--pink:#f472b6;--white:#5a3158;--dim:rgba(90,49,88,.6);--card:rgba(255,255,255,.65);--border:rgba(90,49,88,.14);--track:rgba(90,49,88,.08);--track-strong:rgba(90,49,88,.2);--gold-text:#b45309;--show-stars:0;}
body[data-theme="unicorn"]{--bg:linear-gradient(135deg,#fde2ff 0%,#e9d5ff 35%,#c7e9f1 70%,#fff0f6 100%);--navy:rgba(255,255,255,.6);--purple:#a855f7;--blue:#38bdf8;--green:#34d399;--yellow:#fde047;--orange:#fb923c;--red:#f43f5e;--pink:#ec4899;--white:#4c1d95;--dim:rgba(76,29,149,.6);--card:rgba(255,255,255,.55);--border:rgba(168,85,247,.22);--track:rgba(76,29,149,.08);--track-strong:rgba(168,85,247,.28);--gold-text:#b45309;--show-stars:0;}
body[data-theme="kawaii"]{--bg:#ffd6e7;--navy:#ffb3d1;--purple:#ff5da2;--blue:#84d3eb;--green:#b6e8c1;--yellow:#ffeb99;--orange:#ffb38a;--red:#ff5d8a;--pink:#ffb3d1;--white:#44103c;--dim:rgba(68,16,60,.6);--card:rgba(255,255,255,.7);--border:rgba(255,93,162,.22);--track:rgba(68,16,60,.08);--track-strong:rgba(255,93,162,.28);--gold-text:#b45309;--show-stars:0;}
body{background:var(--bg);}
body[data-theme="unicorn"]{background:var(--bg);background-attachment:fixed;}
#starfield{opacity:var(--show-stars);transition:opacity .3s;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body,#root{width:100%;height:100%;overflow:hidden;}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--white);user-select:none;-webkit-user-select:none;font-weight:600;}
#root{position:relative;}

/* ─── Starfield ─── */
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}

/* ─── Screens ─── */
.screen{position:relative;z-index:1;width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}

/* ─── Card ─── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* ─── Buttons ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--rl);font-family:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;padding:13px 26px;min-height:52px;transition:transform .1s,opacity .1s;letter-spacing:.02em;}
.btn:active{transform:scale(.92);}
.btn-primary{background:linear-gradient(135deg,#6c63ff,#4dabf7);color:#fff;box-shadow:0 4px 18px rgba(108,99,255,.45);}
.btn-success{background:linear-gradient(135deg,#40c057,#69db7c);color:#fff;box-shadow:0 4px 18px rgba(64,192,87,.4);}
.btn-danger{background:linear-gradient(135deg,#fa5252,#ff6b6b);color:#fff;box-shadow:0 4px 18px rgba(250,82,82,.4);}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--white);}
.btn-lg{font-size:1.35rem;padding:20px 36px;min-height:68px;border-radius:var(--rxl);}
.btn-full{width:100%;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* ─── Gradient text ─── */
.grad{background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ─── Animations ─── */
@keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes bounce{0%,100%{transform:scale(1);}30%{transform:scale(1.4);}65%{transform:scale(.92);}82%{transform:scale(1.12);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-14px);}40%{transform:translateX(14px);}60%{transform:translateX(-9px);}80%{transform:translateX(9px);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0;}60%{transform:scale(1.3) rotate(8deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes ringFill{from{stroke-dashoffset:408;}to{stroke-dashoffset:var(--offset,0);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes pulseGlow{0%,100%{box-shadow:0 6px 28px rgba(108,99,255,.45);}50%{box-shadow:0 6px 48px rgba(108,99,255,.85);}}

/* ─── Welcome Screen ─── */
#s-welcome{padding:28px 20px 40px;gap:0;}
#s-welcome .logo{font-size:5rem;animation:float 3s ease-in-out infinite;display:block;text-align:center;}
#s-welcome h1{font-size:clamp(2.2rem,8vw,3.5rem);font-weight:900;text-align:center;margin:4px 0 2px;}
#s-welcome .sub{text-align:center;color:var(--dim);font-size:1.05rem;margin-bottom:28px;}
.profiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:13px;width:100%;max-width:540px;margin-bottom:16px;}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px;border-radius:var(--rl);cursor:pointer;border:2px solid transparent;transition:transform .12s;position:relative;}
.profile-card:active{transform:scale(.91);}
.profile-card .av{font-size:2.8rem;line-height:1;}
.profile-card .pname{font-size:.95rem;font-weight:800;text-align:center;word-break:break-word;}
.profile-card .del-btn{position:absolute;top:6px;right:6px;background:rgba(250,82,82,.85);border:none;border-radius:50%;width:26px;height:26px;font-size:.7rem;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;}
.edit-mode .del-btn{display:flex;}
.add-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px;border-radius:var(--rl);cursor:pointer;border:2px dashed var(--border);color:var(--dim);font-family:inherit;font-weight:700;font-size:.9rem;background:none;transition:all .15s;}
.add-card:active{transform:scale(.91);}
.add-card .add-ic{font-size:2.2rem;}

/* ─── Modal ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal{width:100%;max-width:400px;padding:30px 26px;border-radius:var(--rxl);background:#1a1a4e;border:1px solid var(--border);animation:slideUp .28s ease;}
.modal h2{font-size:1.45rem;font-weight:900;margin-bottom:16px;text-align:center;}
.av-picker{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:12px 0 14px;}
.av-opt{font-size:1.9rem;cursor:pointer;padding:5px 7px;border-radius:var(--r);border:2px solid transparent;background:none;transition:all .14s;}
.av-opt.sel{border-color:var(--yellow);background:rgba(255,224,102,.14);}
.inp{width:100%;background:var(--card);border:2px solid var(--border);border-radius:var(--r);color:var(--white);font-family:inherit;font-size:1.25rem;font-weight:700;padding:13px 16px;outline:none;text-align:center;}
.inp:focus{border-color:var(--purple);}
.inp::placeholder{color:var(--dim);}
.err{color:var(--red);font-size:.88rem;font-weight:700;text-align:center;margin-top:7px;}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.modal-btns .btn{flex:1;}

/* ─── Home Screen ─── */
#s-home{padding:22px 20px 40px;align-items:center;}
.home-hdr{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.greeting{display:flex;align-items:center;gap:11px;}
.greeting .hav{font-size:2.8rem;line-height:1;}
.gtext .hey{font-size:.9rem;color:var(--dim);font-weight:600;}
.gtext .gname{font-size:1.45rem;font-weight:900;line-height:1.1;}
.gtext .home-clock{font-size:.78rem;color:var(--dim);font-weight:700;margin-top:3px;letter-spacing:.02em;}
.app-version{margin-top:18px;font-size:.7rem;font-weight:700;color:var(--dim);opacity:.6;letter-spacing:.04em;}
.update-banner{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px max(10px,env(safe-area-inset-top,0));background:linear-gradient(135deg,#6c63ff,#4dabf7);color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;animation:bannerSlide .25s ease both;}
.update-banner .ub-text{flex:1;text-align:center;letter-spacing:.01em;}
.update-banner .ub-close{flex-shrink:0;background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:900;width:30px;height:30px;border-radius:50%;cursor:pointer;font-family:inherit;font-size:.85rem;}
.update-banner .ub-close:active{transform:scale(.9);}
@keyframes bannerSlide{from{transform:translateY(-100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.home-hdr-btns{display:flex;gap:8px;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center;transition:transform .1s;}
.icon-btn:active{transform:scale(.88);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px;margin-bottom:20px;}
.stat-card{padding:13px 8px;border-radius:var(--rl);text-align:center;}
.stat-val{font-size:1.55rem;font-weight:900;line-height:1;}
.stat-lbl{font-size:.68rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.voucher-progress{width:100%;max-width:520px;margin-bottom:18px;}
.vp-inner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--rl);}
.vp-bar-bg{height:6px;background:var(--track);border-radius:100px;overflow:hidden;margin-top:6px;}
.vp-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .5s ease;}
.play-wrap{width:100%;max-width:520px;margin-bottom:18px;}
.play-btn{width:100%;font-size:1.5rem;padding:22px;min-height:82px;border-radius:var(--rxl);background:linear-gradient(135deg,#6c63ff,#ff6b6b);color:#fff;border:none;font-family:inherit;font-weight:900;cursor:pointer;animation:pulseGlow 2.5s ease-in-out infinite;transition:transform .1s;letter-spacing:.02em;}
.play-btn:active{transform:scale(.96);animation:none;}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;}
.act-card{padding:16px 12px;border-radius:var(--rl);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;border:none;background:var(--card);border:1px solid var(--border);color:var(--white);font-family:inherit;font-weight:700;transition:transform .1s;}
.act-card:active{transform:scale(.91);}
.act-ic{font-size:1.9rem;}
.act-lbl{font-size:.88rem;}
.act-sub{font-size:.78rem;color:var(--gold-text);font-weight:700;}
.section-title{font-size:.78rem;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;}
.sessions-wrap,.vouchers-wrap{width:100%;max-width:520px;margin-top:18px;}
.sess-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);margin-bottom:7px;}
.sess-date{font-size:.83rem;color:var(--dim);font-weight:600;}
.sess-sub{font-size:.72rem;color:var(--dim);font-weight:600;}
.sess-score{font-size:.98rem;font-weight:800;}
.vouch-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,224,102,.1),rgba(255,146,43,.1));border:1px solid rgba(255,224,102,.22);margin-bottom:7px;cursor:pointer;transition:transform .1s;}
.vouch-item:active{transform:scale(.97);}
.vouch-name{font-size:.9rem;font-weight:700;}
.vouch-date{font-size:.78rem;color:var(--dim);font-weight:600;}

/* ─── Quiz Screen ─── */
#s-quiz{padding:0;justify-content:flex-start;}
.quiz-hdr{width:100%;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;}
.quiz-prog-txt{font-size:.95rem;font-weight:800;color:var(--dim);}
.quiz-score-txt{font-size:1.05rem;font-weight:900;color:var(--gold-text);}
.prog-bar-wrap{width:100%;padding:8px 18px 0;height:12px;}
.prog-bar-bg{width:100%;height:7px;background:var(--track);border-radius:100px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .3s ease;}
.timer-wrap{width:100%;padding:8px 18px 0;}
.timer-bg{width:100%;height:9px;background:var(--track);border-radius:100px;overflow:hidden;}
.timer-fill{height:100%;border-radius:100px;transition:width .1s linear,background-color .3s;}
.timer-txt{text-align:right;font-size:.82rem;font-weight:800;margin-top:4px;color:var(--dim);}
.question-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 10px;gap:14px;width:100%;}
.mascot{font-size:3.8rem;line-height:1;transition:transform .3s;}
.question-card{width:100%;max-width:420px;padding:26px 18px;text-align:center;border-radius:var(--rxl);background:rgba(108,99,255,.12);border:2px solid rgba(108,99,255,.32);}
.question-txt{font-size:clamp(2rem,9vw,3.8rem);font-weight:900;line-height:1;letter-spacing:-.02em;}
.answer-display{margin-top:12px;min-height:52px;background:var(--card);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;border:2px solid var(--border);letter-spacing:.06em;transition:border-color .2s,background .2s;color:var(--white);}
.answer-display.has-val{border-color:var(--purple);background:rgba(108,99,255,.15);}
.cursor{display:inline-block;width:2px;height:30px;background:var(--purple);margin-left:3px;animation:twinkle 1s ease-in-out infinite;vertical-align:middle;}

/* ─── Number Pad ─── */
.num-pad{width:100%;max-width:370px;padding:0 18px 24px;}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.pad-btn{height:62px;border-radius:var(--r);border:none;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,filter .1s;}
.pad-btn:active{transform:scale(.86);}
.pad-digit{background:var(--card);color:var(--white);border:1px solid var(--border);font-size:1.55rem;font-weight:800;}
.pad-back{background:rgba(250,82,82,.18);color:var(--red);border:1px solid rgba(250,82,82,.28);font-size:1.35rem;font-weight:800;}
.pad-submit{background:linear-gradient(135deg,#40c057,#69db7c);color:#fff;box-shadow:0 4px 14px rgba(64,192,87,.38);font-size:1.7rem;}
.pad-submit:disabled{opacity:.3;box-shadow:none;cursor:not-allowed;}
.pad-placeholder{height:62px;}

/* ─── Feedback Overlay ─── */
.feedback-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:slideUp .18s ease;}
.feedback-overlay.correct{background:rgba(64,192,87,.92);}
.feedback-overlay.wrong{background:rgba(250,82,82,.9);}
.fb-icon{font-size:5.5rem;animation:bounce .5s ease;}
.fb-title{font-size:2.4rem;font-weight:900;}
.fb-pts{font-size:1.35rem;font-weight:800;opacity:.9;}
.fb-ans{font-size:2.25rem;font-weight:900;opacity:1;letter-spacing:.01em;background:rgba(255,255,255,.18);padding:10px 22px;border-radius:100px;display:inline-block;}

/* ─── Results Screen ─── */
#s-results{padding:28px 20px 44px;align-items:center;gap:6px;}
.res-mascot{font-size:5rem;animation:bounce .6s ease .2s both;}
.res-title{font-size:clamp(1.6rem,6vw,2.5rem);font-weight:900;text-align:center;margin:8px 0 3px;animation:slideUp .4s ease .3s both;opacity:0;}
.res-sub{text-align:center;font-size:1.05rem;font-weight:700;margin-bottom:20px;color:var(--dim);animation:slideUp .4s ease .4s both;opacity:0;}
.ring-wrap{position:relative;width:158px;height:158px;margin-bottom:22px;flex-shrink:0;overflow:hidden;animation:slideUp .4s ease .5s both;opacity:0;}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--track);stroke-width:10;}
.ring-fill{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease;}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-size:2.1rem;font-weight:900;line-height:1;}
.ring-max{font-size:.85rem;font-weight:700;color:var(--dim);}
.stars-row{display:flex;gap:11px;font-size:2.8rem;margin-bottom:18px;animation:slideUp .4s ease .6s both;opacity:0;}
.star-item{animation:starPop .5s ease both;}
.star-item:nth-child(2){animation-delay:.14s;}
.star-item:nth-child(3){animation-delay:.28s;}
.enc-banner{padding:12px 22px;border-radius:var(--rl);font-size:1.05rem;font-weight:800;text-align:center;margin-top:4px;margin-bottom:18px;animation:slideUp .4s ease .7s both;opacity:0;}
.correct-count{margin-bottom:18px;font-weight:700;color:var(--dim);font-size:.95rem;animation:slideUp .4s ease .72s both;opacity:0;}
.vouch-earned{width:100%;max-width:420px;padding:16px 18px;border-radius:var(--rl);background:linear-gradient(135deg,rgba(255,224,102,.18),rgba(255,146,43,.18));border:2px solid rgba(255,224,102,.38);text-align:center;margin-bottom:18px;cursor:pointer;animation:slideUp .4s ease .78s both;opacity:0;}
.ve-trophy{font-size:2.4rem;}
.ve-title{font-size:1.15rem;font-weight:900;color:var(--gold-text);}
.ve-sub{font-size:.9rem;color:var(--dim);font-weight:600;margin-top:3px;}
.res-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;animation:slideUp .4s ease .86s both;opacity:0;}
.breakdown-section{width:100%;max-width:420px;margin-top:14px;animation:slideUp .4s ease .94s both;opacity:0;}
.breakdown-toggle-btn{width:100%;text-align:center;font-size:.88rem;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;cursor:pointer;padding:4px 0;background:none;border:none;color:var(--dim);font-family:inherit;}

<body>
<div id="root"></div>
<div id="starfield"></div>

<script>
'use strict';

/* ════════════════════════════════════════════
   APP VERSION — bump this before every deploy.
   Format suggestion: YYYY-MM-DD-N (N = same-day serial).
   The auto-update banner reads this from the live HTML
   and compares against the running value.
════════════════════════════════════════════ */
const APP_VERSION = "2026-05-13-3";

// Module-scope flags for the auto-update banner.
// `didRun` prevents re-checking on every render; `dismissed` hides the banner for this session.
const UpdateChecker = { didRun: false, dismissed: false };

/* Fetch the live HTML (cache-busted), extract its APP_VERSION, compare with the running one.
   Resolves to one of:
     { status:'up-to-date',     current: '…' }
     { status:'update-available', current: '…', latest: '…' }
     { status:'error',          message: '…' }
   Used by the manual "Check for update" button and the auto-check on app open. */
async function checkForUpdate() {
  try {
    const baseUrl = location.href.split('?')[0].split('#')[0];
    const res = await fetch(baseUrl + '?cb=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return { status:'error', message: 'HTTP ' + res.status };
    const text = await res.text();
    const m = text.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
    if (!m) return { status:'error', message: 'Could not find APP_VERSION in fetched HTML' };
    const latest = m[1];
    if (latest === APP_VERSION) return { status:'up-to-date', current: APP_VERSION };
    return { status:'update-available', current: APP_VERSION, latest };
  } catch (e) {
    return { status:'error', message: e.message || String(e) };
  }
}

// Show / hide the floating "Update available" banner at the top of the viewport.
function showUpdateBanner(latest) {
  if (document.getElementById('update-banner')) return; // already showing
  const bar = document.createElement('div');
  bar.id = 'update-banner';
  bar.className = 'update-banner';
  bar.innerHTML = `
    <span class="ub-text">🆕 New version available (v ${latest}) — tap to reload</span>
    <button class="ub-close" aria-label="Dismiss">✕</button>
  `;
  bar.addEventListener('click', (e) => {
    if (e.target.classList.contains('ub-close')) {
      UpdateChecker.dismissed = true;
      bar.remove();
      e.stopPropagation();
      return;
    }
    location.reload();
  });
  document.body.appendChild(bar);
}

// Fire the update check once, 2 seconds after the app opens.
function scheduleAutoUpdateCheck() {
  if (UpdateChecker.didRun) return;
  UpdateChecker.didRun = true;
  setTimeout(async () => {
    if (UpdateChecker.dismissed) return;
    const r = await checkForUpdate();
    if (r.status === 'update-available' && !UpdateChecker.dismissed) {
      showUpdateBanner(r.latest);
    }
    // Silent on up-to-date and error — auto-check should be unobtrusive.
  }, 2000);
}

/* ════════════════════════════════════════════
   STORAGE
════════════════════════════════════════════ */
const Store = (() => {
  const read = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const KEYS = { KIDS:'ms_kids', SETTINGS:'ms_settings', SESSIONS:'ms_sessions', VOUCHERS:'ms_vouchers', PIN:'ms_pin', REVISIONS:'ms_revisions' };

  const DEFAULT_SETTINGS = { difficulty:'medium', timerSeconds:15, questionCount:20, modules:{ multiplication:true, division:false } };

  return {
    getKids: () => read(KEYS.KIDS, []),
    saveKid(kid) {
      const kids = this.getKids();
      const i = kids.findIndex(k => k.id === kid.id);
      if (i >= 0) kids[i] = kid; else kids.push(kid);
      write(KEYS.KIDS, kids);
    },
    deleteKid(id) {
      write(KEYS.KIDS, this.getKids().filter(k => k.id !== id));
      const s = read(KEYS.SESSIONS, {}); delete s[id]; write(KEYS.SESSIONS, s);
      const v = read(KEYS.VOUCHERS, {}); delete v[id]; write(KEYS.VOUCHERS, v);
      const r = read(KEYS.REVISIONS, {}); delete r[id]; write(KEYS.REVISIONS, r);
    },
    getSettings: () => ({ ...DEFAULT_SETTINGS, ...read(KEYS.SETTINGS, {}) }),
    saveSettings: (s) => write(KEYS.SETTINGS, s),
    getSessions: (kid) => { const a = read(KEYS.SESSIONS, {}); return a[kid] || []; },
    saveSession(kidId, sess) {
      const a = read(KEYS.SESSIONS, {});
      if (!a[kidId]) a[kidId] = [];
      a[kidId].push(sess);
      write(KEYS.SESSIONS, a);
    },
    getVouchers: (kid) => { const a = read(KEYS.VOUCHERS, {}); return a[kid] || []; },
    saveVoucher(kidId, v) {
      const a = read(KEYS.VOUCHERS, {});
      if (!a[kidId]) a[kidId] = [];
      a[kidId].push(v);
      write(KEYS.VOUCHERS, a);
    },
    getRevisionSessions: (kid) => { const a = read(KEYS.REVISIONS, {}); return a[kid] || []; },
    saveRevisionSession(kidId, sess) {
      const a = read(KEYS.REVISIONS, {});
      if (!a[kidId]) a[kidId] = [];
      a[kidId].push(sess);
      write(KEYS.REVISIONS, a);
    },
    getPin: () => localStorage.getItem(KEYS.PIN) || '1234',
    savePin: (p) => localStorage.setItem(KEYS.PIN, p),

    recordCertificate(kidId, kidName, score, maxScore, dateIso, difficulty) {
      const pct = score / maxScore;
      const ach = pct >= .98 ? 'Perfect Star Champion' : pct >= .95 ? 'Math Superstar' : 'Math Champion';
      const c = {
        id: Date.now().toString(), kidId, kidName,
        earnedDate: new Date(dateIso || Date.now()).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }),
        score, maxScore, percent: Math.round(pct * 100),
        difficulty, achievement: ach
      };
      this.saveVoucher(kidId, c);
      return c;
    }
  };
})();

/* ════════════════════════════════════════════
   QUESTIONS
════════════════════════════════════════════ */
const Questions = {
  ranges: { easy:{min:1,max:5}, medium:{min:1,max:10}, hard:{min:1,max:12} },
  rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  make(difficulty, modules) {
    const { min, max } = this.ranges[difficulty] || this.ranges.medium;
    const active = Object.entries(modules).filter(([,on]) => on).map(([t]) => t);
    const type = active.length ? active[Math.floor(Math.random() * active.length)] : 'multiplication';
    if (type === 'division') {
      const b = this.rand(min, max), ans = this.rand(min, max), a = b * ans;
      return { display:`${a} ÷ ${b}`, answer:ans };
    }
    const a = this.rand(min, max), b = this.rand(min, max);
    return { display:`${a} × ${b}`, answer:a * b };
  },
  makeSet(n, difficulty, modules) { return Array.from({length:n}, () => this.make(difficulty, modules)); }
};

/* ════════════════════════════════════════════
   SCORING
════════════════════════════════════════════ */
const POINTS_PER_Q = 10;
const maxScoreFor = (qCount) => qCount * POINTS_PER_Q;

function calcPoints(correct, timeLeft, totalTime) {
  if (!correct) return 0;
  return Math.max(1, Math.ceil(POINTS_PER_Q * Math.max(0, timeLeft / totalTime)));
}

function getStars(score, maxScore) {
  const p = score / maxScore;
  return p >= .9 ? 3 : p >= .6 ? 2 : 1;
}

function getEncouragement(score, maxScore) {
  const p = score / maxScore;
  if (p >= .95) return { text:'🌟 PERFECT! You\'re a genius!', color:'#ffe066' };
  if (p >= .8)  return { text:'🚀 AMAZING! You\'re a Math Superstar!', color:'#69db7c' };
  if (p >= .6)  return { text:'🎉 GREAT JOB! Keep blasting off!', color:'#4dabf7' };
  if (p >= .4)  return { text:'💪 GOOD WORK! Practice makes perfect!', color:'#f783ac' };
  return { text:'🌈 Keep going! Every try makes you stronger!', color:'#ff922b' };
}

function sessionMaxScore(sess) {
  return maxScoreFor(sess.questionCount || 20);
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function scoreColor(score, maxScore) {
  const p = score / maxScore;
  return p >= .8 ? 'var(--green)' : p >= .6 ? 'var(--yellow)' : p >= .4 ? 'var(--orange)' : 'var(--red)';
}

/* ════════════════════════════════════════════
   DOM HELPERS
════════════════════════════════════════════ */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  const add = (child) => {
    if (child == null || child === false) return;
    if (typeof child === 'string' || typeof child === 'number') {
      e.appendChild(document.createTextNode(String(child)));
    } else if (Array.isArray(child)) {
      child.forEach(add);
    } else {
      e.appendChild(child);
    }
  };
  kids.forEach(add);
  return e;
}

function div(cls, ...kids) { return el('div', { class: cls }, ...kids); }
function span(cls, text) { return el('span', { class: cls }, text); }
function btn(cls, txt, onClick) { const b = el('button', { class: `btn ${cls}` }, txt); b.addEventListener('click', onClick); return b; }
function text(t) { return document.createTextNode(t); }

/* ════════════════════════════════════════════
   THEMES
════════════════════════════════════════════ */
const THEMES = [
  { id:'galaxy',  name:'Galaxy',         emoji:'🌌', preview:['#0a0a1a','#6c63ff','#4dabf7'] },
  { id:'pastel',  name:'Pastel',         emoji:'🌸', preview:['#fff5f7','#b39ddb','#a8e6cf'] },
  { id:'bw',      name:'Black & White',  emoji:'⚫', preview:['#ffffff','#000000','#888888'] },
  { id:'train',   name:'Train',          emoji:'🚂', preview:['#1e2530','#d63031','#fab005'] },
  { id:'girly',   name:'Cute Girly',     emoji:'💖', preview:['#fff0f6','#f472b6','#c084fc'] },
  { id:'unicorn', name:'Unicorn',        emoji:'🦄', preview:['#fde2ff','#a855f7','#34d399'] },
  { id:'kawaii',  name:'Kawaii',         emoji:'🐰', preview:['#ffd6e7','#ff5da2','#84d3eb'] },
];
const DEFAULT_THEME = 'galaxy';
function applyTheme(themeId) {
  const id = THEMES.find(t => t.id === themeId) ? themeId : DEFAULT_THEME;
  document.body.dataset.theme = id;
}

/* ════════════════════════════════════════════
   STARFIELD
════════════════════════════════════════════ */
(function buildStarfield() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 70; i++) {
    const s = el('div', {
      class: 'star',
      style: {
        top: `${Math.random()*100}%`,
        left: `${Math.random()*100}%`,
        width: `${Math.random()*3+1}px`,
        height: `${Math.random()*3+1}px`,
        '--d': `${(Math.random()*3+2).toFixed(1)}s`,
        '--dl': `${(Math.random()*4).toFixed(1)}s`,
      }
    });
    sf.appendChild(s);
  }
})();

/* ════════════════════════════════════════════
   APP STATE
════════════════════════════════════════════ */
const App = {
  screen: 'welcome',
  kid: null,
  settings: Store.getSettings(),
  result: null,
  voucher: null,
  _quizTimer: null,
  _feedbackTimer: null,

  navigate(screen, data = {}) {
    // Clean up quiz timer if leaving quiz
    if (this._quizTimer) { clearInterval(this._quizTimer); this._quizTimer = null; }
    if (this._feedbackTimer) { clearTimeout(this._feedbackTimer); this._feedbackTimer = null; }
    if (this._quizKeyHandler) { document.removeEventListener('keydown', this._quizKeyHandler); this._quizKeyHandler = null; }
    if (this._homeClock && screen !== 'home') { clearInterval(this._homeClock); this._homeClock = null; }
    if ('kid'      in data) this.kid      = data.kid;
    if ('result'   in data) this.result   = data.result;
    if ('voucher'  in data) this.voucher  = data.voucher;
    if ('settings' in data) { this.settings = data.settings; Store.saveSettings(data.settings); }
    this.screen = screen;
    this.render();
  },

  render() {
    const root = document.getElementById('root');
    while (root.firstChild) root.removeChild(root.firstChild);
    applyTheme(this.kid && this.kid.theme);
    const screens = {
      welcome: () => renderWelcome(),
      home:    () => this.kid ? renderHome() : renderWelcome(),
      quiz:    () => this.kid ? renderQuiz() : renderWelcome(),
      results: () => (this.kid && this.result) ? renderResults() : renderWelcome(),
      voucher: () => renderVoucher(),
      summary: () => this.kid ? renderSummary() : renderWelcome(),
      settings:() => this.kid ? renderChildSettings() : renderWelcome(),
      revision:() => this.kid ? renderRevision() : renderWelcome(),
      revisionQuiz:() => (this.kid && this._revSelected) ? renderRevisionQuiz() : renderRevision(),
      revisionResults:() => (this.kid && this._revisionResult) ? renderRevisionResults() : renderRevision(),
      parent:  () => renderParent(),
    };
    const fn = screens[this.screen] || screens.welcome;
    root.appendChild(fn());
  }
};

const AVATARS = ['🦁','🐯','🐼','🦊','🐸','🦄','🐶','🐱','🐭','🐹','🦋','🐧'];
const COLORS  = ['#6c63ff','#ff6b6b','#4ecdc4','#ff922b','#f783ac','#69db7c','#4dabf7','#ffe066'];

function renderWelcome() {
  let kids = Store.getKids();
  let editMode = false;
  let showAdd = false;
  let selAvatar = AVATARS[0];
  let addErr = '';

  const screen = div('screen', el('div', { id:'s-welcome', class:'screen', style:{padding:'28px 20px 40px',gap:0} }));
  const inner = screen.firstChild;

  function rebuild() {
    while (inner.firstChild) inner.removeChild(inner.firstChild);

    inner.appendChild(el('span', { class:'logo' }, '🚀'));
    inner.appendChild(el('h1', { class:'grad' }, 'Math Stars'));
    inner.appendChild(el('p', { class:'sub' }, 'Choose your player!'));

    const grid = el('div', { class:'profiles-grid' + (editMode ? ' edit-mode' : '') });

    kids.forEach(kid => {
      const card = el('div', {
        class: 'card profile-card',
        style: { borderColor: kid.color + '55', background: kid.color + '18' }
      });

      const avEl = el('span', { class:'av' }, kid.avatar);
      const nameEl = el('span', { class:'pname' });
      nameEl.textContent = kid.name;

      const delBtn = el('button', { class:'del-btn', 'aria-label':'Delete' }, '✕');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm(`Remove ${kid.name}? All their scores will be deleted.`)) return;
        Store.deleteKid(kid.id);
        kids = Store.getKids();
        rebuild();
      });

      card.appendChild(avEl); card.appendChild(nameEl); card.appendChild(delBtn);
      card.addEventListener('click', () => {
        if (!editMode) App.navigate('home', { kid });
      });
      grid.appendChild(card);
    });

    const addCard = el('button', { class:'add-card' });
    addCard.appendChild(el('span', { class:'add-ic' }, '➕'));
    addCard.appendChild(document.createTextNode('New Player'));
    addCard.addEventListener('click', () => { showAdd = true; editMode = false; rebuild(); });
    grid.appendChild(addCard);
    inner.appendChild(grid);

    if (kids.length > 0) {
      const editBtn = btn('btn-ghost', editMode ? '✓ Done' : '✏️ Edit Players', () => {
        editMode = !editMode; rebuild();
      });
      editBtn.style.marginTop = '8px';
      editBtn.style.fontSize = '.82rem';
      inner.appendChild(editBtn);
    }

    if (showAdd) {
      const overlay = el('div', { class:'overlay' });
      const modal = el('div', { class:'modal' });
      modal.appendChild(el('h2', {}, '🌟 New Player!'));
      modal.appendChild(el('p', { style:{ textAlign:'center', marginBottom:'10px', color:'var(--dim)', fontWeight:'700', fontSize:'.9rem' } }, 'Pick your character:'));

      const picker = el('div', { class:'av-picker' });
      AVATARS.forEach(a => {
        const opt = el('button', { class:'av-opt' + (a === selAvatar ? ' sel' : '') }, a);
        opt.addEventListener('click', () => { selAvatar = a; rebuild(); });
        picker.appendChild(opt);
      });
      modal.appendChild(picker);

      const inp = el('input', { class:'inp', placeholder:'Enter your name...', maxlength:'20', autocomplete:'off' });
      inp.addEventListener('input', () => { addErr = ''; });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
      modal.appendChild(inp);

      if (addErr) {
        const errEl = el('p', { class:'err' }, addErr);
        modal.appendChild(errEl);
      }

      const actions = el('div', { class:'modal-btns' });
      const cancelBtn = btn('btn-ghost', 'Cancel', () => { showAdd = false; addErr = ''; rebuild(); });
      const goBtn = btn('btn-primary', "Let's Go! 🚀", () => doAdd());
      actions.appendChild(cancelBtn); actions.appendChild(goBtn);
      modal.appendChild(actions);

      function doAdd() {
        const name = inp.value.trim();
        if (!name) { addErr = 'Please enter a name! 😊'; rebuild(); return; }
        if (name.length > 20) { addErr = 'Name is too long!'; rebuild(); return; }
        if (kids.some(k => k.name.toLowerCase() === name.toLowerCase())) {
          addErr = 'That name is already taken!'; rebuild(); return;
        }
        const kid = {
          id: Date.now().toString(), name,
          avatar: selAvatar,
          color: COLORS[kids.length % COLORS.length],
          theme: DEFAULT_THEME,
          createdAt: new Date().toISOString()
        };
        Store.saveKid(kid);
        showAdd = false;
        App.navigate('home', { kid });
      }

      overlay.addEventListener('click', () => { showAdd = false; addErr = ''; rebuild(); });
      modal.addEventListener('click', e => e.stopPropagation());
      overlay.appendChild(modal);
      inner.appendChild(overlay);

      setTimeout(() => inp.focus(), 50);
    }
  }

  rebuild();
  return screen;
}

/* ════════════════════════════════════════════
   QUIZ SCREEN
════════════════════════════════════════════ */
function renderQuiz() {
  const { kid, settings } = App;
  const { difficulty, timerSeconds, modules } = settings;
  const N = settings.questionCount || 20;
  const FEEDBACK_MS = 1600;
  const RETRY_GAP = 2; // at least this many OTHER slots between original wrong and its retry

  // Fixed-N slot model: every slot is either a fresh question or a queued retry.
  // Each question gets AT MOST one retry. Session ends strictly when slotsAsked === N.
  const retryQueue = []; // [{ question, dueAfter }]
  let slotsAsked = 0;
  let isCurrentRetry = false;
  let score = 0, answers = [], input = '', phase = 'question';
  let currentQ = pickNext();
  let timeLeft = timerSeconds * 10; // tenths

  function pickNext() {
    if (slotsAsked >= N) return null; // session over
    const dueIdx = retryQueue.findIndex(r => slotsAsked >= r.dueAfter);
    if (dueIdx >= 0) {
      isCurrentRetry = true;
      return retryQueue.splice(dueIdx, 1)[0].question;
    }
    isCurrentRetry = false;
    return Questions.make(difficulty, modules);
  }

  const screen = el('div', { id:'s-quiz', class:'screen quiz-screen' });

  /* --- Elements --- */
  const hdr = div('quiz-hdr');
  const progTxt = el('span', { class:'quiz-prog-txt' }, `Question 1 of ${N}`);
  const scoreTxt = el('span', { class:'quiz-score-txt' }, '⭐ 0 pts');
  hdr.appendChild(progTxt); hdr.appendChild(scoreTxt);
  screen.appendChild(hdr);

  const progBarWrap = div('prog-bar-wrap');
  const progBarBg = div('prog-bar-bg');
  const progBarFill = div('prog-bar-fill'); progBarFill.style.width = '0%';
  progBarBg.appendChild(progBarFill); progBarWrap.appendChild(progBarBg); screen.appendChild(progBarWrap);

  const timerWrap = div('timer-wrap');
  const timerBg = div('timer-bg');
  const timerFill = div('timer-fill'); timerFill.style.width = '100%'; timerFill.style.backgroundColor = 'var(--green)';
  timerBg.appendChild(timerFill); timerWrap.appendChild(timerBg);
  const timerTxt = el('div', { class:'timer-txt' }, `${timerSeconds}s`);
  timerWrap.appendChild(timerTxt); screen.appendChild(timerWrap);

  const qa = div('question-area');
  const mascot = el('span', { class:'mascot' }, '🚀');
  const qCard = div('card question-card');
  const qTxt = div('question-txt');
  qTxt.textContent = currentQ.display + ' = ?';
  const ansDisp = div('answer-display');
  const cursor = div('cursor');
  ansDisp.appendChild(cursor);
  qCard.appendChild(qTxt); qCard.appendChild(ansDisp);
  qa.appendChild(mascot); qa.appendChild(qCard);
  screen.appendChild(qa);

  /* --- Number Pad --- */
  const numPad = div('num-pad');
  const padGrid = div('pad-grid');
  const KEYS_LAYOUT = ['1','2','3','4','5','6','7','8','9','BACK','0','OK'];
  const padBtns = {};
  KEYS_LAYOUT.forEach(k => {
    let btn2;
    if (k === 'BACK') {
      btn2 = el('button', { class:'pad-btn pad-back', 'aria-label':'Backspace' }, '⌫');
      btn2.addEventListener('click', () => pressBack());
    } else if (k === 'OK') {
      btn2 = el('button', { class:'pad-btn pad-submit', 'aria-label':'Submit' }, '✓');
      btn2.setAttribute('disabled', 'true');
      btn2.addEventListener('click', () => submitAnswer());
    } else {
      btn2 = el('button', { class:'pad-btn pad-digit', 'aria-label':k }, k);
      btn2.addEventListener('click', () => pressDigit(k));
    }
    padBtns[k] = btn2;
    padGrid.appendChild(btn2);
  });
  numPad.appendChild(padGrid);
  screen.appendChild(numPad);

  /* --- Update UI --- */
  function updateUI() {
    qTxt.textContent = currentQ.display + ' = ?';
    const shown = Math.min(slotsAsked + 1, N);
    progTxt.textContent = isCurrentRetry
      ? `Question ${shown} of ${N} · Retry`
      : `Question ${shown} of ${N}`;
    scoreTxt.textContent = `⭐ ${Math.round(score)} pts`;
    progBarFill.style.width = `${(slotsAsked / N) * 100}%`;

    const ratio = timeLeft / (timerSeconds * 10);
    timerFill.style.width = `${ratio * 100}%`;
    timerFill.style.backgroundColor = ratio > .5 ? 'var(--green)' : ratio > .25 ? 'var(--yellow)' : 'var(--red)';
    timerTxt.textContent = `${Math.ceil(timeLeft / 10)}s`;
    timerTxt.style.color = ratio > .5 ? 'var(--green)' : ratio > .25 ? 'var(--yellow)' : 'var(--red)';

    mascot.textContent = phase === 'feedback' ? '' : ratio < .3 ? '😰' : '🚀';

    // Answer display
    while (ansDisp.firstChild) ansDisp.removeChild(ansDisp.firstChild);
    if (input) {
      ansDisp.classList.add('has-val');
      ansDisp.textContent = input;
    } else {
      ansDisp.classList.remove('has-val');
      ansDisp.appendChild(cursor);
    }

    padBtns['OK'].disabled = (input === '' || phase === 'feedback');
    ['1','2','3','4','5','6','7','8','9','0','BACK'].forEach(k => {
      padBtns[k].disabled = (phase === 'feedback');
    });
  }

  /* --- Input --- */
  function pressDigit(d) {
    if (phase !== 'question' || input.length >= 4) return;
    input += d;
    updateUI();
  }

  function pressBack() {
    if (phase !== 'question') return;
    input = input.slice(0, -1);
    updateUI();
  }

  function submitAnswer() {
    if (phase !== 'question') return;
    clearInterval(App._quizTimer);
    phase = 'feedback';

    const q = currentQ;
    const userAns = input === '' ? null : parseInt(input, 10);
    const correct = userAns === q.answer;
    // Per-slot points: wrong = 0; correct = 1–10 based on how fast the answer came in.
    const pts = calcPoints(correct, timeLeft / 10, timerSeconds);

    score += pts;
    slotsAsked++;
    const wasRetrySlot = isCurrentRetry;
    const record = { display: q.display, answer: q.answer, userAnswer: userAns, correct, points: pts, isRetry: wasRetrySlot };
    answers.push(record);

    // Wrong FRESH question → queue ONE retry. Wrong retry → no further queue.
    if (!correct && !wasRetrySlot) {
      retryQueue.push({ question: q, dueAfter: slotsAsked + RETRY_GAP });
    }

    // Update live score in header immediately (rounded)
    scoreTxt.textContent = `⭐ ${Math.round(score)} pts`;

    // Mascot animation
    mascot.textContent = correct ? '🎉' : '😢';
    mascot.style.animation = correct ? 'bounce .5s ease' : 'shake .45s ease';
    setTimeout(() => { mascot.style.animation = ''; }, 500);

    // Show feedback overlay (rounded per-slot points)
    showFeedback(correct, Math.round(pts), q.answer);

    App._feedbackTimer = setTimeout(() => {
      removeFeedback();
      mascot.style.animation = '';
      const next = pickNext();
      if (!next) {
        // Session over — exactly N slots have been asked.
        App.navigate('results', {
          result: {
            answers: [...answers],
            score: Math.round(score),
            correctAnswers: answers.filter(a => a.correct).length,
            questionCount: N,
            askedCount: slotsAsked,
            difficulty, modules, timerSeconds,
            date: new Date().toISOString()
          }
        });
      } else {
        currentQ = next;
        input = '';
        phase = 'question';
        timeLeft = timerSeconds * 10;
        updateUI();
        startTimer();
      }
    }, FEEDBACK_MS);
  }

  /* --- Feedback --- */
  let feedbackOverlay = null;

  function showFeedback(correct, pts, correctAnswer) {
    feedbackOverlay = div('feedback-overlay ' + (correct ? 'correct' : 'wrong'));
    const icon = el('div', { class:'fb-icon' }, correct ? '✅' : '❌');
    const title = el('div', { class:'fb-title' }, correct ? 'Correct!' : 'Not Quite!');
    feedbackOverlay.appendChild(icon);
    feedbackOverlay.appendChild(title);
    if (correct) {
      const pts2 = el('div', { class:'fb-pts' }, `+${pts} point${pts !== 1 ? 's' : ''}!`);
      feedbackOverlay.appendChild(pts2);
    } else {
      const ans = el('div', { class:'fb-ans' }, `Answer: ${correctAnswer}`);
      feedbackOverlay.appendChild(ans);
    }
    screen.appendChild(feedbackOverlay);
  }

  function removeFeedback() {
    if (feedbackOverlay) { feedbackOverlay.remove(); feedbackOverlay = null; }
  }

  /* --- Timer --- */
  function startTimer() {
    App._quizTimer = setInterval(() => {
      if (phase !== 'question') return;
      timeLeft--;
      updateUI();
      if (timeLeft <= 0) {
        clearInterval(App._quizTimer);
        submitAnswer();
      }
    }, 100);
  }

  /* --- Keyboard input --- */
  function handleKey(e) {
    if (phase !== 'question') return;
    if (e.key >= '0' && e.key <= '9') {
      pressDigit(e.key);
      e.preventDefault();
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      pressBack();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      if (input !== '') submitAnswer();
      e.preventDefault();
    }
  }
  document.addEventListener('keydown', handleKey);
  App._quizKeyHandler = handleKey;

  updateUI();
  startTimer();
  return screen;
}

/* ════════════════════════════════════════════
   RESULTS SCREEN
════════════════════════════════════════════ */
function renderResults() {
  const { kid, result } = App;
  const { score, correctAnswers, answers, difficulty, modules, timerSeconds, date, questionCount, askedCount } = result;
  const qCount = questionCount || 20;
  const correctCount = correctAnswers != null ? correctAnswers : answers.filter(a => a.correct).length;
  // Scoring: each correct slot earns 1–10 points based on answer speed (10 = instant). Wrong = 0.
  const MAX = qCount * 10;
  const correctPct = correctCount / qCount; // 0..1 — drives tiers, certificate, confetti

  // Tier (label / stars / mascot) keyed on correctPct, not speed-scaled score.
  const tier =
    correctPct === 1   ? { label:'PERFECT!',    stars:3, mascot:'🏆', color:'#ffe066', enc:'🌟 PERFECT! You\'re a genius!' } :
    correctPct >= 0.9  ? { label:'Amazing!',    stars:3, mascot:'🎊', color:'#69db7c', enc:'🚀 AMAZING! You\'re a Math Superstar!' } :
    correctPct >= 0.6  ? { label:'Great Job!',  stars:2, mascot:'🚀', color:'#4dabf7', enc:'🎉 GREAT JOB! Keep blasting off!' } :
                         { label:'Keep Going!', stars:1, mascot:'🌟', color:'#ff922b', enc:'🌈 Keep going! Every try makes you stronger!' };

  // Save session (with new fields)
  const session = { id: Date.now().toString(), kidId: kid.id, date, score, correctAnswers: correctCount, answers, difficulty, modules: JSON.stringify(modules), timerSeconds, questionCount: qCount, maxScore: MAX, correctPct, askedCount: askedCount || answers.length };
  Store.saveSession(kid.id, session);

  // Certificate only at 100% — any wrong (including a wrong retry) disqualifies.
  const earnedCertificate = correctPct === 1
    ? Store.recordCertificate(kid.id, kid.name, score, MAX, date, difficulty)
    : null;

  const stars = tier.stars;
  const enc = { text: tier.enc, color: tier.color };
  const showConfetti = correctPct >= 0.9;

  const screen = el('div', { id:'s-results', class:'screen results-screen' });

  // Confetti
  if (showConfetti) {
    const CONF_COLORS = ['#ffe066','#ff6b6b','#69db7c','#4dabf7','#f783ac','#ff922b'];
    for (let i = 0; i < 28; i++) {
      const p = el('div', { class:'conf-piece', style:{
        left:`${Math.random()*100}%`,

  screen.appendChild(subEl);

  // Score ring
  const RING_R = 65, RING_C = 2 * Math.PI * RING_R;
  const targetOffset = RING_C * (1 - score / MAX);

  const ringWrap = div('ring-wrap');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');

  const s1 = document.createElementNS(svgNS, 'stop'); s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#6c63ff');
  const s2 = document.createElementNS(svgNS, 'stop'); s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#4dabf7');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad); svg.appendChild(defs);

  const bgCircle = document.createElementNS(svgNS, 'circle');
  bgCircle.setAttribute('class', 'ring-bg'); bgCircle.setAttribute('cx', '80'); bgCircle.setAttribute('cy', '80'); bgCircle.setAttribute('r', RING_R);
  svg.appendChild(bgCircle);

  const fillCircle = document.createElementNS(svgNS, 'circle');
  fillCircle.setAttribute('class', 'ring-fill'); fillCircle.setAttribute('cx', '80'); fillCircle.setAttribute('cy', '80'); fillCircle.setAttribute('r', RING_R);
  fillCircle.setAttribute('stroke-dasharray', RING_C);
  fillCircle.setAttribute('stroke-dashoffset', RING_C);
  svg.appendChild(fillCircle);
  ringWrap.appendChild(svg);

  const ringText = div('ring-text');
  const ringNum = div('ring-num'); ringNum.textContent = score;
  const ringMax = div('ring-max'); ringMax.textContent = `/${MAX}`;
  ringText.appendChild(ringNum); ringText.appendChild(ringMax);
  ringWrap.appendChild(ringText);
  screen.appendChild(ringWrap);

  setTimeout(() => { fillCircle.style.strokeDashoffset = targetOffset; }, 300);

  // Stars
  const starsRow = div('stars-row');
  [1,2,3].forEach(n => {
    const s = el('span', { class:'star-item', style:{ opacity: n <= stars ? '1' : '0.2' } }, n <= stars ? '⭐' : '☆');
    starsRow.appendChild(s);
  });
  screen.appendChild(starsRow);

  // Encouragement
  const encBanner = div('enc-banner');
  encBanner.textContent = enc.text;
  encBanner.style.background = enc.color + '25';
  encBanner.style.border = `2px solid ${enc.color}55`;
  encBanner.style.color = 'var(--white)';
  screen.appendChild(encBanner);

  const ccEl = el('p', { class:'correct-count' }, `✓ ${correctCount}/${qCount} correct`);
  screen.appendChild(ccEl);

  // Certificate earned (>=90%)
  if (earnedCertificate) {
    const ve = div('vouch-earned');
    ve.appendChild(el('div', { class:'ve-trophy' }, '🏆'));
    const vt = el('div', { class:'ve-title' }, 'Certificate Earned!');
    const vs2 = el('div', { class:'ve-sub' }); vs2.textContent = `Tap to see your certificate, ${kid.name}!`;
    ve.appendChild(vt); ve.appendChild(vs2);
    ve.addEventListener('click', () => App.navigate('voucher', { voucher: earnedCertificate }));
    screen.appendChild(ve);
  }

  // Actions
  const actWrap = div('res-actions');
  const playAgain = btn('btn-primary btn-lg btn-full', '🚀 Play Again!', () => App.navigate('quiz'));
  const goHome = btn('btn-ghost btn-full', '🏠 Go Home', () => App.navigate('home'));
  actWrap.appendChild(playAgain); actWrap.appendChild(goHome);
  screen.appendChild(actWrap);

  // Breakdown
  let showBreakdown = false;
  const bdSection = div('breakdown-section');
  const bdToggle = el('button', { class:'breakdown-toggle-btn' }, '▼ Show Question Details');
  bdToggle.addEventListener('click', () => {
    showBreakdown = !showBreakdown;
    bdToggle.textContent = showBreakdown ? '▲ Hide Details' : '▼ Show Question Details';
    while (bdList.firstChild) bdList.removeChild(bdList.firstChild);
    if (showBreakdown) {
      answers.forEach((a, i) => {
        const item = el('div', { class:`bd-item ${a.correct ? 'bd-correct' : 'bd-wrong'}` });
        item.appendChild(el('span', {}, a.correct ? '✓' : '✗'));
        const qEl = el('span', { class:'bd-q' }); qEl.textContent = a.display;
        item.appendChild(qEl);
        const uEl = el('span', { style:{color:'var(--dim)',fontSize:'.83rem'} });
        uEl.textContent = a.userAnswer ?? '—';
        item.appendChild(uEl);
        const ptEl = el('span', { class:'bd-pts' }); ptEl.textContent = a.correct ? `+${a.points}` : '0';
        item.appendChild(ptEl);
        bdList.appendChild(item);
      });
    }
  });
  const bdList = div('breakdown-list');
  bdSection.appendChild(bdToggle); bdSection.appendChild(bdList);
  screen.appendChild(bdSection);

  return screen;
}

/* ════════════════════════════════════════════
   PARENT DASHBOARD
════════════════════════════════════════════ */
function renderParent() {
  const screen = el('div', { id:'s-parent', class:'screen parent-screen' });
  let authed = false;

  function showPinEntry() {
    while (screen.firstChild) screen.removeChild(screen.firstChild);

    const overlay = el('div', { class:'overlay' });
    const modal = el('div', { class:'modal' });
    modal.appendChild(el('h2', {}, '🔒 Parent Access'));
    const subEl = el('p', { style:{textAlign:'center',color:'var(--dim)',fontWeight:'600',marginBottom:'18px',fontSize:'.88rem',lineHeight:'1.5'} });
    subEl.textContent = 'Enter your 4-digit PIN\n(Default: 1234)';
    modal.appendChild(subEl);

    let pin = '';
    const dots = div('pin-dots');
    for (let i = 0; i < 4; i++) dots.appendChild(div('pin-dot'));
    modal.appendChild(dots);

    const pinPad = div('pin-pad');
    const PIN_KEYS = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    const errEl = el('div', { class:'pin-err', style:{display:'none'} });

    function updateDots() {
      const dotEls = dots.querySelectorAll('.pin-dot');
      dotEls.forEach((d, i) => { d.classList.toggle('filled', i < pin.length); });
    }

    function pressPin(k) {
      if (k === '⌫') { pin = pin.slice(0,-1); errEl.style.display = 'none'; updateDots(); return; }
      if (pin.length >= 4) return;
      pin += k;
      updateDots();
      if (pin.length === 4) {
        if (pin === Store.getPin()) {
          authed = true;
          showDashboard();
        } else {
          errEl.textContent = 'Wrong PIN! Try again.';
          errEl.style.display = 'block';
          pin = '';
          updateDots();
        }
      }
    }

    PIN_KEYS.forEach(k => {
      if (k === '') { pinPad.appendChild(div('')); return; }
      const b = el('button', { class:'pin-btn' }, k);
      b.addEventListener('click', () => pressPin(k));
      pinPad.appendChild(b);
    });

    modal.appendChild(pinPad);
    modal.appendChild(errEl);

    const cancelBtn = btn('btn-ghost', 'Cancel', () => App.navigate('home'));
    cancelBtn.style.marginTop = '18px';
    cancelBtn.style.width = '100%';
    modal.appendChild(cancelBtn);

    overlay.appendChild(modal);
    screen.appendChild(overlay);
  }

  function showDashboard() {
    while (screen.firstChild) screen.removeChild(screen.firstChild);

    let settings = { ...App.settings };
    let pinMsg = '';
    let selectedKidId = null;

    const backBtn = btn('btn-ghost par-back', '← Back', () => App.navigate('home', { settings }));
    screen.appendChild(backBtn);

    const titleRow = div('par-title');
    titleRow.appendChild(el('span', { style:{fontSize:'2rem'} }, '⚙️'));
    titleRow.appendChild(el('h1', {}, 'Parent Settings'));
    screen.appendChild(titleRow);

    // ─── Quiz Settings ───
    const qs = div('set-section');
    const qst = div('set-sec-title'); qst.textContent = 'Quiz Settings';
    qs.appendChild(qst);
    const qsCard = div('card set-card');

    // Difficulty
    const diffRow = div('set-row');
    diffRow.style.flexDirection = 'column';
    diffRow.style.alignItems = 'flex-start';
    diffRow.style.gap = '8px';
    const diffLabel = div('set-label'); diffLabel.textContent = 'Difficulty';
    const diffSeg = div('seg');
    [['easy','Easy (1–5)'],['medium','Med (1–10)'],['hard','Hard (1–12)']].forEach(([v, lbl]) => {
      const b = el('button', { class:'seg-btn' + (settings.difficulty === v ? ' active' : '') }, lbl);
      b.addEventListener('click', () => {
        settings.difficulty = v;
        diffSeg.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        App.settings = settings;
        Store.saveSettings(settings);
      });
      diffSeg.appendChild(b);
    });
    diffRow.appendChild(diffLabel); diffRow.appendChild(diffSeg);
    qsCard.appendChild(diffRow);

    // Timer
    const timerSection = div('');
    const timerRow = div('set-row');
    const timerInfo = div('');
    const timerLbl = div('set-label'); timerLbl.textContent = 'Time per Question';
    const timerSub = div('set-sub'); timerSub.textContent = `${settings.timerSeconds} seconds`;
    timerInfo.appendChild(timerLbl); timerInfo.appendChild(timerSub);
    timerRow.appendChild(timerInfo);
    timerSection.appendChild(timerRow);

    const sliderWrap = div('slider-wrap'); sliderWrap.style.marginTop = '10px';
    const slider = el('input', { type:'range', class:'slider', min:'5', max:'30', step:'5', value:settings.timerSeconds });
    slider.addEventListener('input', () => {
      settings.timerSeconds = parseInt(slider.value, 10);
      timerSub.textContent = `${settings.timerSeconds} seconds`;
      App.settings = settings;
      Store.saveSettings(settings);
    });
    const lbls = div('slider-lbls');
    lbls.appendChild(el('span', {}, '5s (Fast)'));
    lbls.appendChild(el('span', {}, '30s (Slow)'));
    sliderWrap.appendChild(slider); sliderWrap.appendChild(lbls);
    timerSection.appendChild(sliderWrap);
    qsCard.appendChild(timerSection);

    // Modules
    const modSection = div('');
    const modLbl = div('set-label'); modLbl.textContent = 'Math Types'; modLbl.style.marginBottom = '10px';
    modSection.appendChild(modLbl);

    [['multiplication','✖️ Multiplication'],['division','➗ Division']].forEach(([key, label]) => {
      const row = div('set-row'); row.style.marginTop = '8px';
      const lbl = el('div', { style:{fontWeight:'700'} }, label);
      const tog = el('label', { class:'tog-wrap' });
      const inp2 = el('input', { type:'checkbox' });
      inp2.checked = settings.modules[key];
      inp2.addEventListener('change', () => {
        const next = { ...settings.modules, [key]: inp2.checked };
        if (!next.multiplication && !next.division) { inp2.checked = !inp2.checked; return; }
        settings.modules = next;
        App.settings = settings;
        Store.saveSettings(settings);
      });
      const track = div('tog-track');
      tog.appendChild(inp2); tog.appendChild(track);
      row.appendChild(lbl); row.appendChild(tog);
      modSection.appendChild(row);
    });
    qsCard.appendChild(modSection);

    // Question count
    const qcRow = div('set-row');
    qcRow.style.flexDirection = 'column';
    qcRow.style.alignItems = 'flex-start';
    qcRow.style.gap = '8px';
    qcRow.style.marginTop = '14px';
    const qcLabel = div('set-label'); qcLabel.textContent = 'Questions per Test';
    const qcSeg = div('seg');
    [10, 20, 30].forEach(n => {
      const b = el('button', { class:'seg-btn' + (settings.questionCount === n ? ' active' : '') }, `${n}`);
      b.addEventListener('click', () => {
        settings.questionCount = n;
        qcSeg.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        App.settings = settings;
        Store.saveSettings(settings);
      });
      qcSeg.appendChild(b);
    });
    qcRow.appendChild(qcLabel); qcRow.appendChild(qcSeg);
    qsCard.appendChild(qcRow);

    qs.appendChild(qsCard);
    screen.appendChild(qs);

    // ─── Security ───
    const sec = div('set-section');
    const secT = div('set-sec-title'); secT.textContent = 'Security';
    sec.appendChild(secT);
    const secCard = div('card set-card');
    const secLbl = div('set-label'); secLbl.textContent = 'Change Parent PIN';
    secCard.appendChild(secLbl);

    const pinInputs = el('div', { style:{display:'flex',gap:'10px',marginTop:'8px'} });
    const newPinInp = el('input', { class:'inp', type:'password', inputmode:'numeric', maxlength:'4', placeholder:'New PIN' });
    newPinInp.style.flex = '1'; newPinInp.style.fontSize = '1rem'; newPinInp.style.padding = '10px 14px';
    newPinInp.addEventListener('input', () => { newPinInp.value = newPinInp.value.replace(/\D/g,''); });
    const confPinInp = el('input', { class:'inp', type:'password', inputmode:'numeric', maxlength:'4', placeholder:'Confirm' });
    confPinInp.style.flex = '1'; confPinInp.style.fontSize = '1rem'; confPinInp.style.padding = '10px 14px';
    confPinInp.addEventListener('input', () => { confPinInp.value = confPinInp.value.replace(/\D/g,''); });
    pinInputs.appendChild(newPinInp); pinInputs.appendChild(confPinInp);
    secCard.appendChild(pinInputs);

    const pinMsgEl = el('p', { style:{fontWeight:'700',marginTop:'7px',textAlign:'center',display:'none'} });
    const updatePinBtn = btn('btn-primary', 'Update PIN', () => {
      const np = newPinInp.value, cp = confPinInp.value;
      if (!/^\d{4}$/.test(np)) { showPinMsg('PIN must be exactly 4 digits.', false); return; }
      if (np !== cp) { showPinMsg("PINs don't match!", false); return; }
      Store.savePin(np);
      newPinInp.value = ''; confPinInp.value = '';
      showPinMsg('✓ PIN changed!', true);
    });
    updatePinBtn.style.marginTop = '10px';

    function showPinMsg(msg, ok) {
      pinMsgEl.textContent = msg;
      pinMsgEl.style.color = ok ? 'var(--green)' : 'var(--red)';
      pinMsgEl.style.display = 'block';
      if (ok) setTimeout(() => { pinMsgEl.style.display = 'none'; }, 2500);
    }

    secCard.appendChild(updatePinBtn); secCard.appendChild(pinMsgEl);
    sec.appendChild(secCard);
    screen.appendChild(sec);

    // ─── App Update ───
    const upd = div('set-section');
    const updT = div('set-sec-title'); updT.textContent = 'App Update';
    upd.appendChild(updT);
    const updCard = div('card set-card');

    const updRow = div('');
    const curEl = div('set-label'); curEl.textContent = `Current version`;
    const curSub = div('set-sub'); curSub.textContent = `v ${APP_VERSION}`;
    updRow.appendChild(curEl); updRow.appendChild(curSub);
    updCard.appendChild(updRow);

    const updStatus = el('p', { style:{fontWeight:'700',marginTop:'10px',textAlign:'center',fontSize:'.9rem'} });
    updStatus.textContent = 'Tap Check for Update to see if a new version is available.';
    updStatus.style.color = 'var(--dim)';

    const checkBtn = btn('btn-primary', '🔄 Check for Update', async () => {
      checkBtn.disabled = true;
      updStatus.textContent = 'Checking…';
      updStatus.style.color = 'var(--dim)';
      const r = await checkForUpdate();
      if (r.status === 'up-to-date') {
        updStatus.textContent = `✓ You're up to date (v ${r.current})`;
        updStatus.style.color = 'var(--green)';
        checkBtn.textContent = '🔄 Check Again';
        checkBtn.disabled = false;
      } else if (r.status === 'update-available') {
        updStatus.textContent = `🆕 Update available: v ${r.latest} (you have v ${r.current})`;
        updStatus.style.color = 'var(--gold-text)';
        checkBtn.textContent = '⬇️ Reload to Update';
        checkBtn.onclick = () => location.reload();
        checkBtn.disabled = false;
      } else {
        updStatus.textContent = `Couldn't check: ${r.message}`;
        updStatus.style.color = 'var(--red)';
        checkBtn.textContent = '🔄 Try Again';
        checkBtn.disabled = false;
      }
    });
    checkBtn.style.marginTop = '10px';

    updCard.appendChild(checkBtn);
    updCard.appendChild(updStatus);
    upd.appendChild(updCard);
    screen.appendChild(upd);

    // ─── Player History ───
    const ph = div('set-section');
    const pht = div('set-sec-title'); pht.textContent = 'Player History';
    ph.appendChild(pht);
    const phCard = div('card set-card');
    const kids = Store.getKids();

    if (kids.length === 0) {
      const noK = el('p', { style:{color:'var(--dim)',textAlign:'center',fontWeight:'600'} }, 'No players yet.');
      phCard.appendChild(noK);
    }

    kids.forEach(kid => {
      const kidSection = div('');
      const kidRow = div('set-row');
      const kidInfo = div(''); kidInfo.style.display = 'flex'; kidInfo.style.alignItems = 'center'; kidInfo.style.gap = '10px';
      const kidAv = el('span', { style:{fontSize:'1.55rem'} }, kid.avatar);
      const kidTxt = div('');
      const kidNm = el('div', { style:{fontWeight:'800'} }); kidNm.textContent = kid.name;
      const kidSub = el('div', { style:{fontSize:'.78rem',color:'var(--dim)',fontWeight:'600'} });
      kidSub.textContent = `${Store.getSessions(kid.id).length} sessions played`;
      kidTxt.appendChild(kidNm); kidTxt.appendChild(kidSub);
      kidInfo.appendChild(kidAv); kidInfo.appendChild(kidTxt);
      kidRow.appendChild(kidInfo);

      const kidBtns = el('div', { style:{display:'flex',gap:'7px'} });
      const viewBtn = btn('btn-ghost', selectedKidId === kid.id ? 'Hide' : 'View', () => {
        selectedKidId = selectedKidId === kid.id ? null : kid.id;
        showDashboard();
      });
      viewBtn.style.padding = '6px 12px'; viewBtn.style.fontSize = '.82rem'; viewBtn.style.minHeight = '36px';

      const delBtn = btn('btn-danger', '🗑️', () => {
        if (!confirm(`Delete ${kid.name} and all their data?`)) return;
        Store.deleteKid(kid.id);
        if (selectedKidId === kid.id) selectedKidId = null;
        showDashboard();
      });
      delBtn.style.padding = '6px 12px'; delBtn.style.fontSize = '.82rem'; delBtn.style.minHeight = '36px';

      kidBtns.appendChild(viewBtn); kidBtns.appendChild(delBtn);
      kidRow.appendChild(kidBtns);
      kidSection.appendChild(kidRow);

      if (selectedKidId === kid.id) {
        const kidSessions = Store.getSessions(kid.id);
        if (kidSessions.length === 0) {
          const ns = el('p', { style:{color:'var(--dim)',fontSize:'.88rem',fontWeight:'600',marginTop:'8px'} }, 'No sessions yet.');
          kidSection.appendChild(ns);
        } else {
          const sessList = div('');
          sessList.style.marginTop = '10px';
          [...kidSessions].reverse().forEach(s => {
            const si = div('par-sess-item');
            const sMax = sessionMaxScore(s);
            const dateEl2 = el('div', { class:'psi-date' }); dateEl2.textContent = fmtDate(s.date);
            const corrEl = el('div', { class:'psi-correct' }); corrEl.textContent = `${s.correctAnswers}/${s.questionCount || 20} ✓`;
            const scoreEl = el('div', { class:'psi-score' }); scoreEl.textContent = `${s.score} pts`;
            scoreEl.style.color = scoreColor(s.score, sMax);
            si.appendChild(dateEl2); si.appendChild(corrEl); si.appendChild(scoreEl);
            sessList.appendChild(si);
          });
          kidSection.appendChild(sessList);
        }
      }

      phCard.appendChild(kidSection);
    });

    ph.appendChild(phCard);
    screen.appendChild(ph);
  }

  showPinEntry();
  return screen;
}

/* ════════════════════════════════════════════
   SUMMARY SCREEN
════════════════════════════════════════════ */
function renderSummary() {
  const { kid } = App;
  const sessions = Store.getSessions(kid.id);
  const certificates = Store.getVouchers(kid.id);
  let view = 'day'; // 'day' | 'month' | 'year'

  const screen = el('div', { id:'s-summary', class:'screen summary-screen' });
  const backBtn = btn('btn-ghost par-back', '← Back', () => App.navigate('home'));
  screen.appendChild(backBtn);

  const titleRow = div('par-title');
  titleRow.appendChild(el('span', { style:{fontSize:'2rem'} }, '📊'));
  titleRow.appendChild(el('h1', {}, 'My Progress'));
  screen.appendChild(titleRow);

  const tabs = div('sum-tabs');
  const tabBtns = [];
  [['day','Day'],['month','Month'],['year','Year']].forEach(([v, lbl]) => {
    const b = el('button', { class:'seg-btn' + (view === v ? ' active' : '') }, lbl);
    b.addEventListener('click', () => {
      view = v;
      tabBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      rebuildBody();
    });
    tabBtns.push(b);
    tabs.appendChild(b);
  });
  screen.appendChild(tabs);

  const body = div('sum-body');
  screen.appendChild(body);

  function bucketsFor(view) {
    const now = new Date();
    // Returns: [{label, start, end}] where end is exclusive.
    if (view === 'day') {
      // last 7 days (oldest → newest)
      const out = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now); d.setDate(now.getDate() - i); d.setHours(0,0,0,0);
        const next = new Date(d); next.setDate(d.getDate() + 1);
        out.push({ label: d.toLocaleDateString('en-US', { weekday:'short' }), start: d, end: next });
      }
      return out;
    }
    if (view === 'month') {
      // each day of current month
      const y = now.getFullYear(), m = now.getMonth();
      const last = new Date(y, m + 1, 0).getDate();
      const out = [];
      for (let day = 1; day <= last; day++) {
        const d = new Date(y, m, day);
        const next = new Date(y, m, day + 1);
        out.push({ label: String(day), start: d, end: next });
      }
      return out;
    }
    // year: 12 months of current year
    const y = now.getFullYear();
    const monthsShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return monthsShort.map((mn, i) => ({
      label: mn,
      start: new Date(y, i, 1),
      end: new Date(y, i + 1, 1)
    }));
  }

  function bucketStats(b) {
    const inB = sessions.filter(s => {
      const t = new Date(s.date).getTime();
      return t >= b.start.getTime() && t < b.end.getTime();
    });
    if (inB.length === 0) return { count: 0, avgPct: 0, totalScore: 0 };
    let pctSum = 0;
    inB.forEach(s => { pctSum += (s.correctAnswers || 0) / (s.questionCount || 20); });
    return { count: inB.length, avgPct: pctSum / inB.length, totalScore: inB.reduce((a,s)=>a+s.score,0) };
  }

  function trendMessage(buckets) {
    const withData = buckets.filter(b => b._stats.count > 0);
    if (withData.length < 2) return { text:'Keep playing to see your progress! 🌱', tone:'neutral' };
    const half = Math.ceil(withData.length / 2);
    const earlier = withData.slice(0, half);
    const later = withData.slice(half);
    const avg = arr => arr.reduce((a,b)=>a+b._stats.avgPct,0) / arr.length;
    const delta = avg(later) - avg(earlier);
    if (delta > 0.05) return { text:'🚀 Amazing progress! You\'re getting faster and sharper!', tone:'up' };
    if (delta < -0.05) return { text:'💪 Keep practising — bumpy days happen, you\'ve got this!', tone:'down' };
    return { text:'⭐ Steady and strong — practice every day pays off!', tone:'flat' };
  }

  function rebuildBody() {
    while (body.firstChild) body.removeChild(body.firstChild);

    const buckets = bucketsFor(view);
    buckets.forEach(b => { b._stats = bucketStats(b); });

    // Aggregates
    const totalCount = sessions.length;
    const avgPct = totalCount ? sessions.reduce((a,s) => a + ((s.correctAnswers || 0) / (s.questionCount || 20)), 0) / totalCount : 0;
    const totalStars = sessions.reduce((a,s) => {
      const p = (s.correctAnswers || 0) / (s.questionCount || 20);
      return a + (p >= 0.9 ? 3 : p >= 0.6 ? 2 : 1);
    }, 0);

    const aggRow = div('sum-agg');
    [
      [totalCount, 'Tests Played'],
      [Math.round(avgPct * 100) + '%', 'Average Score'],
      [totalStars, 'Stars Earned'],
      [certificates.length, 'Certificates']
    ].forEach(([v, l]) => {
      const c = div('card sum-agg-card');
      const vEl = div('sum-agg-val'); vEl.textContent = v;
      const lEl = div('sum-agg-lbl'); lEl.textContent = l;
      c.appendChild(vEl); c.appendChild(lEl);
      aggRow.appendChild(c);
    });
    body.appendChild(aggRow);

    // Chart card
    const chartCard = div('card sum-chart-card');
    const chartTitle = div('sum-chart-title');
    chartTitle.textContent = view === 'day' ? 'Last 7 days' : view === 'month' ? 'This month' : 'This year';
    chartCard.appendChild(chartTitle);

    const svgNS = 'http://www.w3.org/2000/svg';
    const N = buckets.length;
    const W = Math.max(300, N * 28);
    const H = 160;
    const PAD_L = 28, PAD_R = 8, PAD_T = 10, PAD_B = 26;
    const innerW = W - PAD_L - PAD_R;
    const innerH = H - PAD_T - PAD_B;
    const barW = (innerW / N) * 0.7;
    const slot = innerW / N;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', String(H));
    svg.style.display = 'block';

    // Y-axis grid lines at 0/50/100%
    [0, 0.5, 1].forEach(p => {
      const y = PAD_T + innerH - p * innerH;
      const ln = document.createElementNS(svgNS, 'line');
      ln.setAttribute('x1', PAD_L); ln.setAttribute('x2', W - PAD_R);
      ln.setAttribute('y1', y); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', 'currentColor'); ln.setAttribute('stroke-opacity', '0.12');
      ln.setAttribute('stroke-dasharray', p === 0 ? '0' : '3,3');
      svg.appendChild(ln);
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', PAD_L - 6); txt.setAttribute('y', y + 4);
      txt.setAttribute('font-size', '10'); txt.setAttribute('text-anchor', 'end');
      txt.setAttribute('fill', 'currentColor'); txt.setAttribute('opacity', '0.55');
      txt.textContent = Math.round(p * 100) + '%';
      svg.appendChild(txt);
    });

    buckets.forEach((b, i) => {
      const pct = b._stats.avgPct;
      const x = PAD_L + i * slot + (slot - barW) / 2;
      const h = pct * innerH;
      const y = PAD_T + innerH - h;
      if (b._stats.count > 0) {
        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', barW); rect.setAttribute('height', Math.max(2, h));
        rect.setAttribute('rx', '3');
        const color = pct >= .9 ? '#69db7c' : pct >= .6 ? '#ffe066' : pct >= .4 ? '#ff922b' : '#ff6b6b';
        rect.setAttribute('fill', color);
        svg.appendChild(rect);
      }
      // x-axis label
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', x + barW / 2); label.setAttribute('y', H - 8);
      label.setAttribute('font-size', '10'); label.setAttribute('text-anchor', 'middle');
      label.setAttribute('fill', 'currentColor'); label.setAttribute('opacity', '0.6');
      const showLabel = view === 'month' ? (i % 3 === 0 || i === N - 1) : true;
      if (showLabel) label.textContent = b.label;
      svg.appendChild(label);
    });

    chartCard.appendChild(svg);
    body.appendChild(chartCard);

    // Encouraging trend message
    const tm = trendMessage(buckets);
    const msg = div('card sum-msg');
    msg.textContent = tm.text;
    body.appendChild(msg);

    if (totalCount === 0) {
      const empty = div('sum-empty');
      empty.textContent = 'No tests played yet — tap Play Now! to start.';
      body.appendChild(empty);
    }
  }

  rebuildBody();
  return screen;
}

/* ════════════════════════════════════════════
   REVISION SCREEN — Template selection
════════════════════════════════════════════ */
function renderRevision() {
  const { kid } = App;
  let selectedTemplate = App._revSelected || null; // 1..12 — persists across re-renders

  // Compute best score per template (1..12) from saved revision sessions
  const revSessions = Store.getRevisionSessions(kid.id);
  const bestByTemplate = {};
  revSessions.forEach(s => {
    if (bestByTemplate[s.template] == null || s.score > bestByTemplate[s.template]) {
      bestByTemplate[s.template] = s.score;
    }
  });

  const screen = el('div', { id:'s-revision', class:'screen revision-screen' });

  const backBtn = btn('btn-ghost par-back', '← Back', () => App.navigate('home'));
  screen.appendChild(backBtn);

  const titleRow = div('par-title');
  titleRow.appendChild(el('span', { style:{fontSize:'2rem'} }, '📖'));
  titleRow.appendChild(el('h1', {}, 'Revision — Times Tables'));
  screen.appendChild(titleRow);

  const sub = el('p', { class:'rev-sub' }, 'Pick a times table to practise. 12 questions in order.');
  screen.appendChild(sub);

  // Template grid — ×1 through ×12 (4×3)
  const grid = div('rev-grid');
  for (let n = 1; n <= 12; n++) {
    const b = el('button', { class: 'rev-tile' + (selectedTemplate === n ? ' sel' : '') });
    const label = el('div', { class:'rev-tile-label' }, `× ${n}`);
